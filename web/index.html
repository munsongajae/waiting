<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f1e7">
  <meta name="robots" content="noindex, nofollow">
  <title>그리운보리밥 웨이팅</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="status-body">
  <!-- 주소만 알고 들어온 손님에게 보이는 안내 화면. 입구 태블릿은 /kiosk, 관리자는 /admin -->
  <main class="status-page">
    <div class="status-card">
      <svg class="bowl" viewBox="0 0 512 512" aria-hidden="true" style="width: 96px">
        <path d="M96 250h320c0 96-72 164-160 164S96 346 96 250z" fill="currentColor"/>
        <path d="M256 96c-14 30-14 70 0 110 14-40 14-80 0-110z" fill="var(--green)"/>
        <path d="M256 150c-30-8-58 0-76 20 30 8 58 0 76-20zM256 150c30-8 58 0 76 20-30 8-58 0-76-20z" fill="var(--green)"/>
      </svg>
      <p class="status-store">그리운보리밥</p>
      <div class="status-done">웨이팅 안내</div>
      <p class="status-sub">웨이팅 접수는 <b>매장 입구 태블릿</b>에서 해 주세요.</p>
      <p class="status-sub">이미 접수하셨다면 문자로 받으신<br><b>순서 확인 링크</b>에서 내 순서를 볼 수 있습니다.</p>
    </div>
  </main>
</body>
</html>
